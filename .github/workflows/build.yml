name: 빌드

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    # WPF(net10.0-windows)는 Windows에서만 빌드된다
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 빌드
        run: dotnet build -c Release --nologo

      # 도크 모양 전환은 UI 밖 순수 로직(TopDock.Logic)이라 화면 없이 검증된다
      - name: 테스트
        run: dotnet test tests/TopDock.Tests/TopDock.Tests.csproj -c Release --nologo
